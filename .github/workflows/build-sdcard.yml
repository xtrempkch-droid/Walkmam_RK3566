name: Build ROCKNIX Bootable SD Image

on:
  push:
    tags:
      - 'v*' # Dispara automaticamente ao criar tags como v1.0.0, v1.0.1, etc.
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nome da Tag para a Release (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write # Permissão necessária para criar a Release e enviar o arquivo

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fdisk dosfstools e2fsprogs coreutils zip xz-utils

      - name: Gerar Imagem do Cartão SD
        run: |
          # 1. Criar arquivo de imagem vazio (4GB)
          dd if=/dev/zero of=rocknix-sdcard.img bs=1M count=4000 status=progress

          # 2. Configurar dispositivo Loopback
          LOOPDEV=$(sudo losetup -fP --show rocknix-sdcard.img)
          echo "Dispositivo Loopback configurado em: $LOOPDEV"

          # 3. Criar a Tabela de Partições (MBR)
          (
            echo o     # Nova MBR
            echo n; echo p; echo 1; echo 32768; echo +512M; echo t; echo c
            echo n; echo p; echo 2; echo ; echo 
            echo w
          ) | sudo fdisk $LOOPDEV

          sudo partprobe $LOOPDEV
          sleep 2

          # 4. Formatar as Partições
          sudo mkfs.vfat -F 32 -n "BOOT" ${LOOPDEV}p1
          sudo mkfs.ext4 -F -L "ROOTFS" ${LOOPDEV}p2

          # 5. Gravando Loader e U-Boot nos Offsets do RK356X
          sudo dd if=rk356x_loader_v1.26.114.bin of=$LOOPDEV seek=64 conv=notrunc
          sudo dd if=uboot.img of=$LOOPDEV seek=16384 conv=notrunc

          # 6. Montar partição BOOT e copiar Kernel, DTB e extlinux.conf
          MOUNT_DIR="/mnt/sd_boot"
          sudo mkdir -p $MOUNT_DIR
          sudo mount ${LOOPDEV}p1 $MOUNT_DIR

          sudo cp Image $MOUNT_DIR/
          sudo cp *.dtb $MOUNT_DIR/ 2>/dev/null || true

          sudo mkdir -p $MOUNT_DIR/extlinux
          sudo bash -c "cat << 'EOF' > $MOUNT_DIR/extlinux/extlinux.conf
          LABEL ROCKNIX
            KERNEL /Image
            FDT /rk356x-board.dtb
            APPEND console=ttyS2,1500000 root=/dev/mmcblk0p2 rw rootwait earlycon
          EOF"

          sync
          sudo umount $MOUNT_DIR
          sudo losetup -d $LOOPDEV

      - name: Compactar Imagem (.img.xz)
        run: |
          # Compactação de alta eficiência (mantém o arquivo pequeno para download)
          xz -z -3 -T 0 rocknix-sdcard.img

      - name: Publicar Imagem na aba Releases
        uses: softprops/action-gh-release@v1
        with:
          files: rocknix-sdcard.img.xz
          tag_name: ${{ github.ref_name != '' && github.ref_name || inputs.tag_name }}
          name: Release ${{ github.ref_name != '' && github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
