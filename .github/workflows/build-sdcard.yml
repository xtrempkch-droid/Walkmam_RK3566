name: Build ROCKNIX Bootable SD Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nome da Tag para a Release (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y parted dosfstools e2fsprogs coreutils xz-utils

      - name: Gerar Imagem do Cartão SD
        run: |
          set -e # Força o GitHub Actions a parar imediatamente se houver qualquer erro

          echo "=== 1. Criando imagem vazia de 4GB ==="
          dd if=/dev/zero of=rocknix-sdcard.img bs=1M count=4000 status=progress

          echo "=== 2. Configurando Loopback ==="
          LOOPDEV=$(sudo losetup -fP --show rocknix-sdcard.img)
          echo "Dispositivo Loopback: $LOOPDEV"

          echo "=== 3. Criando Tabela de Partições MBR com Parted ==="
          sudo parted -s $LOOPDEV mklabel msdos
          # Inicia a partição BOOT exatamente em 16MiB (setor 32768 do Rockchip)
          sudo parted -s $LOOPDEV mkpart primary fat32 16MiB 528MiB
          sudo parted -s $LOOPDEV mkpart primary ext4 528MiB 100%
          
          # Sincroniza e aguarda o sistema criar as partições virtuais (p1 e p2)
          sudo udevadm settle
          sleep 3

          echo "=== 4. Formatando as Partições ==="
          sudo mkfs.vfat -F 32 -n "BOOT" ${LOOPDEV}p1
          sudo mkfs.ext4 -F -L "ROOTFS" ${LOOPDEV}p2

          echo "=== 5. Gravando Loader e U-Boot ==="
          # Verifica se o arquivo loader existe no repositório antes de gravar
          if [ ! -f "rk356x_loader_v1.26.114.bin" ]; then
            echo "ERRO FATAL: Arquivo rk356x_loader_v1.26.114.bin não encontrado!"
            exit 1
          fi
          sudo dd if=rk356x_loader_v1.26.114.bin of=$LOOPDEV seek=64 conv=notrunc
          sudo dd if=uboot.img of=$LOOPDEV seek=16384 conv=notrunc

          echo "=== 6. Montando BOOT e Copiando Arquivos ==="
          if [ ! -f "Image" ]; then
            echo "ERRO FATAL: O arquivo do Kernel 'Image' não foi encontrado no repositório!"
            exit 1
          fi

          MOUNT_DIR="/mnt/sd_boot"
          sudo mkdir -p $MOUNT_DIR
          sudo mount ${LOOPDEV}p1 $MOUNT_DIR

          sudo cp Image $MOUNT_DIR/
          
          # Tenta copiar o arquivo .dtb, se não existir exibe um aviso mas não quebra o script
          sudo cp *.dtb $MOUNT_DIR/ 2>/dev/null || echo "Aviso: Nenhum arquivo .dtb encontrado para copiar."

          sudo mkdir -p $MOUNT_DIR/extlinux
          sudo bash -c "cat << 'EOF' > $MOUNT_DIR/extlinux/extlinux.conf
          LABEL ROCKNIX
            KERNEL /Image
            FDT /rk356x-board.dtb
            APPEND console=ttyS2,1500000 root=/dev/mmcblk0p2 rw rootwait earlycon
          EOF"

          sync
          sudo umount $MOUNT_DIR
          sudo losetup -d $LOOPDEV
          echo "=== Imagem montada com sucesso! ==="

      - name: Compactar Imagem (.img.xz)
        run: |
          set -e
          echo "Compactando a imagem (isso pode levar alguns minutos)..."
          xz -z -3 -T 0 rocknix-sdcard.img

      - name: Definir Variável Segura para a Release
        id: release_vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Publicar Imagem na aba Releases
        uses: softprops/action-gh-release@v1
        with:
          files: rocknix-sdcard.img.xz
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
