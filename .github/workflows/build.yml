name: Build Mainline RK3566 (Powkiddy X55) OS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          bison flex libssl-dev bc libncurses-dev kmod u-boot-tools \
          device-tree-compiler python3 python3-pyelftools python3-setuptools \
          swig libelf-dev libgnutls28-dev rsync git wget

    # Kernel mainline: rk3566-powkiddy-x55.dts existe a partir da tag v6.8.
    # Usamos uma tag estável recente que já contenha o suporte.
    - name: Fetch Sources (Mainline U-Boot, Mainline Kernel & RKBIN)
      run: |
        git clone --depth 1 https://source.denx.de/u-boot/u-boot.git uboot
        git clone --depth 1 --branch v6.12 https://github.com/torvalds/linux.git kernel
        git clone --depth 1 https://github.com/rockchip-linux/rkbin.git rkbin

    - name: Build Mainline U-Boot
      run: |
        cd uboot
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        make powkiddy-x55-rk3566_defconfig

        # Blobs binários da Rockchip: BL31 (ATF) e inicializador de DDR.
        # Pegamos a versão mais recente disponível no rkbin.
        BL31=$(ls ../rkbin/bin/rk35/rk3568_bl31_v*.elf | sort -V | tail -n1)
        TPL=$(ls ../rkbin/bin/rk35/rk3566_ddr_1056MHz_v*.bin | sort -V | tail -n1)
        echo "--> BL31=$BL31"
        echo "--> DDR/TPL=$TPL"

        if [ -z "$BL31" ] || [ -z "$TPL" ]; then
          echo "!!! Blobs do rkbin não encontrados. Listando bin/rk35/:"
          ls ../rkbin/bin/rk35/ | grep -iE 'bl31|ddr' | sort
          exit 1
        fi

        make BL31="$BL31" ROCKCHIP_TPL="$TPL" -j"$(nproc)"

        echo "--> Artefatos gerados em uboot/:"
        ls -la idbloader.img u-boot.itb u-boot-rockchip.bin 2>/dev/null || true

    - name: Build Mainline Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        make defconfig

        # Garante que o driver de display/GPU/som básicos da Rockchip
        # estejam ativos (o defconfig arm64 já traz ARCH_ROCKCHIP e a
        # maioria das dependências, mas reforçamos o essencial p/ boot).
        ./scripts/config --enable CONFIG_ARCH_ROCKCHIP \
                          --enable CONFIG_DRM_ROCKCHIP \
                          --enable CONFIG_MMC_DW_ROCKCHIP \
                          --enable CONFIG_ROCKCHIP_SARADC \
                          --enable CONFIG_PWM_ROCKCHIP
        make olddefconfig

        make -j"$(nproc)" Image dtbs modules

        echo "--> Verificando se o dtb da X55 foi gerado:"
        find arch/arm64/boot/dts/rockchip -iname '*powkiddy-x55*'

    - name: Create SD Card Image (.img)
      run: |
        sudo bash << 'EOF'
        set -e

        IMAGE_NAME="rk3566-sdcard.img"
        IMAGE_SIZE_MB=1024

        echo "--> Criando ficheiro de imagem vazio..."
        dd if=/dev/zero of=${IMAGE_NAME} bs=1M count=${IMAGE_SIZE_MB} status=progress

        echo "--> Criando tabela de particoes MBR..."
        parted -s ${IMAGE_NAME} mklabel msdos
        parted -s ${IMAGE_NAME} mkpart primary fat32 16MiB 256MiB
        parted -s ${IMAGE_NAME} mkpart primary ext4 256MiB 100%

        echo "--> Mapeando particoes para Loop Devices..."
        LOOP_DEV=$(losetup -fP --show ${IMAGE_NAME})
        BOOT_DEV="${LOOP_DEV}p1"
        ROOT_DEV="${LOOP_DEV}p2"

        echo "--> Formatando particoes..."
        mkfs.vfat -F 32 -n "BOOT" ${BOOT_DEV}
        mkfs.ext4 -F -L "ROOTFS" ${ROOT_DEV}

        echo "--> Gravando Bootloader do Rockchip nos setores brutos..."
        if [ -f uboot/idbloader.img ]; then
          dd if=uboot/idbloader.img of=${LOOP_DEV} seek=64 conv=notrunc
        fi
        if [ -f uboot/uboot.img ]; then
          dd if=uboot/uboot.img of=${LOOP_DEV} seek=16384 conv=notrunc
        fi
        if [ -f uboot/trust.img ]; then
          dd if=uboot/trust.img of=${LOOP_DEV} seek=24576 conv=notrunc
        fi

        echo "--> Montando particoes..."
        mkdir -p /mnt/boot /mnt/rootfs
        mount ${BOOT_DEV} /mnt/boot
        mount ${ROOT_DEV} /mnt/rootfs

        echo "--> Copiando Kernel e Device Trees..."
        cp kernel/arch/arm64/boot/Image /mnt/boot/
        mkdir -p /mnt/boot/dtbs

        # Busca dinamica por todos os arquivos .dtb gerados
        find kernel/arch/arm64/boot/dts/ -type f -name "*.dtb" -exec cp {} /mnt/boot/ \;
        find kernel/arch/arm64/boot/dts/ -type f -name "*.dtb" -exec cp {} /mnt/boot/dtbs/ \;

        echo "--> Criando arquivo de configuracao do U-Boot (extlinux.conf)..."
        mkdir -p /mnt/boot/extlinux
        cat << "BOOTCFG" > /mnt/boot/extlinux/extlinux.conf
        LABEL CustomOS
            KERNEL /Image
            FDT /rk3566-powkiddy-x35h.dtb
            APPEND console=ttyS2,1500000n8 root=/dev/mmcblk0p2 rw rootwait earlycon
        BOOTCFG

        echo "--> Copiando arquivos do RootFS..."
        cp -a rootfs/* /mnt/rootfs/

        echo "--> Desmontando e limpando..."
        umount /mnt/boot
        umount /mnt/rootfs
        losetup -d ${LOOP_DEV}

        echo "--> Compactando imagem final..."
        gzip -f ${IMAGE_NAME}
        EOF

    - name: Prepare Output Directory
      run: |
        mkdir -p output/dtbs
        [ -f uboot/idbloader.img ] && cp uboot/idbloader.img output/
        [ -f uboot/u-boot.itb ] && cp uboot/u-boot.itb output/
        [ -f uboot/u-boot-rockchip.bin ] && cp uboot/u-boot-rockchip.bin output/
        cp kernel/arch/arm64/boot/Image output/
        cp kernel/arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dtb output/dtbs/

        cat << 'BOOTCFG' > output/extlinux.conf
        LABEL Mainline
            KERNEL /Image
            FDT /dtbs/rk3566-powkiddy-x55.dtb
            APPEND console=ttyS2,1500000n8 root=/dev/mmcblk0p2 rw rootwait earlycon
        BOOTCFG

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rk3566-x55-mainline-output
        path: output/
