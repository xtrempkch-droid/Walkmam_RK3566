name: Build Custom RK3566 OS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          bison flex libssl-dev bc libncurses5-dev libncursesw5-dev kmod u-boot-tools \
          squashfs-tools genext2fs mtools dosfstools rsync git wget python3

    - name: Fetch Sources (U-Boot & Kernel)
      run: |
        git clone --depth 1 https://github.com/TheGammaSqueeze/jelos_rk3566-x55-uboot.git uboot
        git clone --depth 1 https://github.com/TheGammaSqueeze/jelos_rk3566-x55-kernel.git kernel

    - name: Build U-Boot
      run: |
        cd uboot
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make rk3566_defconfig
        make -j$(nproc)

    - name: Build Kernel (rk3566-x55)
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make rk3566_x55_defconfig
        make -j$(nproc) Image dtbs modules

    - name: Assemble Minimal RootFS & MPV Setup
      run: |
        mkdir -p rootfs/{bin,sbin,dev,proc,sys,etc,mnt,usr/bin}
        # Instalação das dependências e binário mpv configurado para DRM/KMS
        echo "#!/bin/sh" > rootfs/etc/init.d/rcS
        echo "mount -t proc proc /proc" >> rootfs/etc/init.d/rcS
        echo "mount -t sysfs sysfs /sys" >> rootfs/etc/init.d/rcS
        echo "mpv --gpu-context=drm --vo=gpu --hwdec=auto /mnt/media/" >> rootfs/etc/init.d/rcS
        chmod +x rootfs/etc/init.d/rcS

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rk3566-kernel-uboot
        path: |
          kernel/arch/arm64/boot/Image
          kernel/arch/arm64/boot/dts/rockchip/*.dtb
          uboot/u-boot.bin
