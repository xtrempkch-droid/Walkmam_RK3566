name: Build Mainline RK3566 (Powkiddy X55) OS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          bison flex libssl-dev bc libncurses-dev kmod u-boot-tools \
          device-tree-compiler python3 python3-pyelftools python3-setuptools \
          swig libelf-dev libgnutls28-dev rsync git wget \
          parted kpartx e2fsprogs dosfstools qemu-user-static debootstrap

    # Kernel mainline: rk3566-powkiddy-x55.dts existe a partir da tag v6.8.
    # Usamos uma tag estável recente que já contenha o suporte.
    - name: Fetch Sources (Mainline U-Boot, Mainline Kernel & RKBIN)
      run: |
        git clone --depth 1 https://source.denx.de/u-boot/u-boot.git uboot
        git clone --depth 1 --branch v6.12 https://github.com/torvalds/linux.git kernel
        git clone --depth 1 https://github.com/rockchip-linux/rkbin.git rkbin

    - name: Build Mainline U-Boot
      run: |
        cd uboot
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        make powkiddy-x55-rk3566_defconfig

        # Versões de blob confirmadas no options da ROCKNIX para RK3566-X55
        # (projects/Rockchip/devices/RK3566-X55/options)
        BL31="../rkbin/bin/rk35/rk3568_bl31_v1.43.elf"
        TPL="../rkbin/bin/rk35/rk3566_ddr_1056MHz_v1.18.bin"

        if [ ! -f "$BL31" ] || [ ! -f "$TPL" ]; then
          echo "!!! Versão exata não encontrada no rkbin atual, usando a mais recente disponível como fallback:"
          BL31=$(ls ../rkbin/bin/rk35/rk3568_bl31_v*.elf | sort -V | tail -n1)
          TPL=$(ls ../rkbin/bin/rk35/rk3566_ddr_1056MHz_v*.bin | sort -V | tail -n1)
        fi
        echo "--> BL31=$BL31"
        echo "--> DDR/TPL=$TPL"

        make BL31="$BL31" ROCKCHIP_TPL="$TPL" -j"$(nproc)"

        echo "--> Artefatos gerados em uboot/:"
        ls -la idbloader.img u-boot.itb u-boot-rockchip.bin 2>/dev/null || true

    - name: Fetch ROCKNIX Config & Patches (RK3566 family - X55 / X35S / X35H)
      run: |
        # A ROCKNIX mantém, no próprio repositório open-source, o .config de
        # kernel e os patches/dts de device-tree já testados e funcionando
        # nessa família de placas. Buscamos aqui em vez de adivinhar.
        #
        # IMPORTANTE: diferente da X55 (que está no Linux mainline), a X35S/
        # X35H NUNCA foi enviada ao mainline — só existe como fonte própria da
        # ROCKNIX. Por isso a busca aqui é ampla (qualquer arquivo com "x35"
        # no nome, não só *.patch).
        git clone --depth 1 https://github.com/ROCKNIX/distribution.git rocknix-src

        echo "--> Localizando linux.aarch64.conf (RK3566, comum a toda a família)..."
        ROCKNIX_KCONFIG=$(find rocknix-src -path '*RK3566*/linux/linux.aarch64.conf' | head -n1)
        echo "Encontrado: $ROCKNIX_KCONFIG"
        cp "$ROCKNIX_KCONFIG" rocknix-kernel.config

        echo "--> Localizando QUALQUER arquivo relacionado a X55/X35S no repositório inteiro..."
        mkdir -p rocknix-patches rocknix-dts
        # (sem restringir a caminhos com "linux" — a ROCKNIX guarda config de
        # cada aparelho em pastas como devices/RK3566-X55/, sem essa palavra)
        find rocknix-src \( -iname '*x55*' -o -iname '*x35*' \) -type f | sort | tee /tmp/x35-files.txt

        echo "--> Conteúdo do arquivo 'options' da X35S/X35H (confirma o nome real do .dtb esperado)..."
        X35_OPTIONS=$(grep -i 'x35' /tmp/x35-files.txt | grep -i 'options$' | head -n1)
        if [ -n "$X35_OPTIONS" ]; then
          echo "Arquivo: $X35_OPTIONS"
          cat "$X35_OPTIONS"
        else
          echo "Nenhum arquivo 'options' específico de X35S/X35H encontrado."
        fi

        # Separa por tipo: patches vão para aplicar com git apply,
        # .dts/.dtsi novos vão direto para dentro da árvore do kernel.
        while read -r f; do
          case "$f" in
            *.patch) cp "$f" rocknix-patches/ ;;
            *.dts|*.dtsi) cp "$f" rocknix-dts/ ;;
          esac
        done < /tmp/x35-files.txt

        echo "--> Patches encontrados:"; ls -la rocknix-patches/ 2>/dev/null
        echo "--> Arquivos .dts/.dtsi encontrados:"; ls -la rocknix-dts/ 2>/dev/null

        echo "--> Localizando o driver compartilhado panel-generic-dsi.c (usado por RK3326/RK3566/RK3576)..."
        # Esse driver NÃO fica na pasta do dispositivo (não tem "x35"/"x55" no
        # nome) — é injetado direto pelo script de build deles a partir de um
        # local comum em projects/ROCKNIX/packages/linux/.
        GENERIC_DSI_C=$(find rocknix-src -iname 'panel-generic-dsi.c' | head -n1)
        echo "Encontrado: $GENERIC_DSI_C"
        if [ -n "$GENERIC_DSI_C" ]; then
          cp "$GENERIC_DSI_C" rocknix-panel-generic-dsi.c
        fi

        echo "--> Localizando o package.mk do kernel da ROCKNIX (mostra como eles registram o driver)..."
        LINUX_PKGMK=$(find rocknix-src -path '*packages/linux/package.mk' | head -n1)
        echo "Encontrado: $LINUX_PKGMK"
        if [ -n "$LINUX_PKGMK" ]; then
          echo "--> Trecho relevante (post_patch / panel-generic-dsi):"
          grep -n -B2 -A20 'generic-dsi\|post_patch' "$LINUX_PKGMK" | head -n 100
          cp "$LINUX_PKGMK" rocknix-linux-package.mk
        fi

    - name: Build Mainline Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        echo "--> Aplicando patches de DTS da X55/X35S (SDIO fix / overclock / etc)..."
        for p in ../rocknix-patches/*.patch; do
          [ -f "$p" ] || continue
          echo "Aplicando $p"
          git apply --reject --whitespace=fix "$p" || echo "!!! Falhou ao aplicar $p, verifique manualmente (pode já não bater com esta versão do kernel)."
        done

        echo "--> Garantindo que todo .dts novo (via patch ou cópia direta) está registrado no Makefile..."
        # Copia primeiro os .dts/.dtsi que vieram soltos (não via patch)
        if ls ../rocknix-dts/*.dts* >/dev/null 2>&1; then
          cp ../rocknix-dts/*.dts* arch/arm64/boot/dts/rockchip/
        fi

        MAKEFILE="arch/arm64/boot/dts/rockchip/Makefile"
        for dtsfile in arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35*.dts \
                       arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dts; do
          [ -f "$dtsfile" ] || continue
          base=$(basename "$dtsfile" .dts)
          if grep -q "${base}\.dtb" "$MAKEFILE"; then
            echo "--> ${base}.dtb já registrado no Makefile"
          else
            echo "--> Registrando ${base}.dtb no Makefile do rockchip (não estava lá — provavelmente veio via patch que só adiciona o .dts)"
            echo "dtb-\$(CONFIG_ARCH_ROCKCHIP) += ${base}.dtb" >> "$MAKEFILE"
          fi
        done

        echo "--> A X35S/X35H não tem porta HDMI física — desabilitando o nó HDMI do SoC no"
        echo "--> .dts antes de compilar (se ficasse habilitado, o Kodi em modo GBM poderia"
        echo "--> escolher esse conector 'fantasma' em vez do painel, deixando a tela preta)."
        if [ -f arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts ]; then
          printf '\n&hdmi {\n\tstatus = "disabled";\n};\n' >> arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts
        fi

        echo "--> Checando modo da porta USB (precisa ser 'otg'/'peripheral', não fixo em 'host',"
        echo "--> pra podermos usar 'USB gadget ethernet' e fazer SSH sem WiFi/Bluetooth)..."
        grep -n 'dr_mode' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts || \
          echo "--> Nenhum 'dr_mode' explícito no .dts da X35S (provavelmente herda do .dtsi base — ok na maioria dos casos, a ROCKNIX confirma suporte a gadget nessa família)."

        echo "--> Usando o .config real da ROCKNIX para RK3566 como base..."
        cp ../rocknix-kernel.config .config

        # O .config da ROCKNIX usa "@INITRAMFS_SOURCE@" como placeholder de
        # template, preenchido pelo build system deles (LibreELEC-based) antes
        # de compilar. Aqui não temos esse pipeline, e como usamos rootfs em
        # partição separada (não initramfs embutido), zeramos esse campo.
        ./scripts/config --set-str CONFIG_INITRAMFS_SOURCE ""

        make olddefconfig

        echo "--> Integrando o driver panel-generic-dsi.c (compartilhado, fora da árvore mainline)..."
        if [ -f ../rocknix-panel-generic-dsi.c ]; then
          cp ../rocknix-panel-generic-dsi.c drivers/gpu/drm/panel/panel-generic-dsi.c

          # Tenta descobrir o nome real da CONFIG_ que a ROCKNIX usa, lendo
          # do próprio package.mk deles em vez de chutar.
          GENERIC_DSI_CONFIG=""
          if [ -f ../rocknix-linux-package.mk ]; then
            GENERIC_DSI_CONFIG=$(grep -oP 'CONFIG_DRM_PANEL_\w*GENERIC\w*' ../rocknix-linux-package.mk | sort -u | head -n1)
          fi
          if [ -z "$GENERIC_DSI_CONFIG" ]; then
            GENERIC_DSI_CONFIG="CONFIG_DRM_PANEL_GENERIC_DSI"
            echo "!!! Não achei o nome exato da CONFIG no package.mk, usando o padrão: $GENERIC_DSI_CONFIG"
          else
            echo "--> Nome real encontrado no package.mk: $GENERIC_DSI_CONFIG"
          fi
          CFG_SYMBOL=${GENERIC_DSI_CONFIG#CONFIG_}

          if ! grep -q "config ${CFG_SYMBOL}$" drivers/gpu/drm/panel/Kconfig; then
            echo "--> Registrando ${CFG_SYMBOL} no Kconfig..."
            KCONFIG_BLOCK=$'\nconfig '"${CFG_SYMBOL}"$'\n\ttristate "Generic MIPI-DSI panel (ROCKNIX)"\n\tdepends on OF\n\tdepends on DRM_MIPI_DSI\n\tdepends on BACKLIGHT_CLASS_DEVICE\n\tselect DRM_KMS_HELPER\n\thelp\n\t  Driver generico de painel MIPI-DSI controlado via sequencia de\n\t  inicializacao declarada no device tree (panel_description).\n'
            if grep -q '^endmenu' drivers/gpu/drm/panel/Kconfig; then
              awk -v block="$KCONFIG_BLOCK" '/^endmenu/ && !done {print block; done=1} {print}' \
                drivers/gpu/drm/panel/Kconfig > /tmp/Kconfig.new
              mv /tmp/Kconfig.new drivers/gpu/drm/panel/Kconfig
            else
              printf '%s\n' "$KCONFIG_BLOCK" >> drivers/gpu/drm/panel/Kconfig
            fi
          else
            echo "--> ${CFG_SYMBOL} já estava no Kconfig"
          fi

          if ! grep -q "panel-generic-dsi.o" drivers/gpu/drm/panel/Makefile; then
            echo "--> Registrando no Makefile..."
            echo "obj-\$(${GENERIC_DSI_CONFIG}) += panel-generic-dsi.o" >> drivers/gpu/drm/panel/Makefile
          else
            echo "--> Já estava registrado no Makefile"
          fi

          echo "--> Habilitando ${GENERIC_DSI_CONFIG} no .config..."
          ./scripts/config --enable "$GENERIC_DSI_CONFIG"
          make olddefconfig
        else
          echo "!!! panel-generic-dsi.c NÃO foi encontrado no repositório da ROCKNIX."
          echo "!!! Sem ele, o painel da X35S/X35H não vai inicializar (mesmo com o .dtb certo),"
          echo "!!! porque o compatible \"rocknix,generic-dsi\" não tem driver nenhum."
        fi

        # "make dtbs" compila TODOS os device trees da plataforma Rockchip de
        # uma vez (não é filtrado por defconfig) — então X55 e X35S saem
        # juntos aqui, sem precisar de nenhum passo extra.
        make -j"$(nproc)" Image dtbs modules

        echo "--> Verificando se os dtbs da X55 e X35S foram gerados:"
        find arch/arm64/boot/dts/rockchip -iname '*powkiddy-x55*' -o -iname '*powkiddy-x35s*'

        echo "--> DIAGNÓSTICO: tudo relacionado a 'panel' no rk3566-powkiddy-x35s.dts"
        grep -n -i -B2 -A10 'panel' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts || echo "Nada com 'panel' encontrado."

        echo "--> DIAGNÓSTICO: tudo relacionado a 'dsi' no rk3566-powkiddy-x35s.dts"
        grep -n -i -B2 -A10 'dsi' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts || echo "Nada com 'dsi' encontrado."

        echo "--> DIAGNÓSTICO: TODAS as linhas 'compatible' do arquivo"
        grep -n 'compatible' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts

        echo "--> DIAGNÓSTICO: esse(s) compatible existe(m) em drivers/gpu/drm/panel/?"
        for c in $(grep -oP 'compatible\s*=\s*"\K[^"]+' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts); do
          echo "-- checando: $c"
          grep -rl "$c" drivers/gpu/drm/panel/ 2>/dev/null || echo "   !!! não encontrado em nenhum driver de painel"
        done

        echo "--> DIAGNÓSTICO: drivers de painel habilitados no .config final"
        grep -i "PANEL" .config | grep '=y\|=m'

        echo "--> DIAGNÓSTICO: drivers de entrada (botões/analógico) habilitados no .config"
        echo "--> (esperado: JOYSTICK_ADC e KEYBOARD_GPIO, usados pelo adc-joystick/gpio-keys"
        echo "--> que a família RK3566 usa pros botões físicos)"
        grep -iE "JOYSTICK_ADC|KEYBOARD_GPIO|KEYBOARD_ADC|INPUT_ADC_KEYS" .config

        echo "--> Garantindo (forçando) que os drivers de botão estão habilitados,"
        echo "--> já que sem rede no aparelho não dá pra checar e corrigir remotamente:"
        ./scripts/config --enable CONFIG_JOYSTICK_ADC
        ./scripts/config --enable CONFIG_KEYBOARD_GPIO
        ./scripts/config --enable CONFIG_KEYBOARD_ADC
        ./scripts/config --enable CONFIG_INPUT_JOYSTICK
        ./scripts/config --enable CONFIG_INPUT_EVDEV

        echo "--> Habilitando USB gadget ethernet (g_ether) pra SSH via cabo USB-C,"
        echo "--> já que a X35H não tem WiFi/Bluetooth:"
        ./scripts/config --enable CONFIG_USB_GADGET
        ./scripts/config --module CONFIG_USB_ETH
        ./scripts/config --enable CONFIG_USB_LIBCOMPOSITE
        ./scripts/config --enable CONFIG_USB_DWC3
        ./scripts/config --enable CONFIG_USB_DWC3_DUAL_ROLE
        ./scripts/config --enable CONFIG_USB_ROLE_SWITCH

        make olddefconfig
        make -j"$(nproc)" Image modules

        if ! find arch/arm64/boot/dts/rockchip -iname '*powkiddy-x35s*' | grep -q .; then
          echo "!!! rk3566-powkiddy-x35s.dtb NÃO existe neste kernel (v6.12 mainline)."
          echo "!!! Isso confirma: suporte à X35S/X35H provavelmente não está upstream ainda,"
          echo "!!! só no fork/patches específicos da ROCKNIX. Sem esse .dtb, o U-Boot não"
          echo "!!! encontra o FDT e o aparelho fica com tela preta (nenhum 'sistema' visível)."
        fi

    - name: Build Minimal RootFS (Debian ARM64)
      run: |
        echo "--> Criando RootFS base Debian ARM64..."
        sudo debootstrap --arch=arm64 --foreign bookworm rootfs http://deb.debian.org/debian/
        sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/
        sudo chroot rootfs /debootstrap/debootstrap --second-stage

        echo "--> Pacotes básicos + acesso via console serial..."
        sudo chroot rootfs bash -c '
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            systemd-sysv udev ifupdown network-manager \
            openssh-server sudo nano
          echo "root:root" | chpasswd
          echo "rk3566-x55" > /etc/hostname
        '

        echo "--> Habilitando login automático no console serial (ttyS2)..."
        sudo mkdir -p rootfs/etc/systemd/system/serial-getty@ttyS2.service.d
        sudo bash -c 'cat << "EOF" > rootfs/etc/systemd/system/serial-getty@ttyS2.service.d/autologin.conf
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin root --keep-baud 1500000,115200,38400,9600 %I $TERM
        EOF'

        echo "--> Habilitando login automático na tela (tty1)..."
        sudo mkdir -p rootfs/etc/systemd/system/getty@tty1.service.d
        sudo bash -c 'cat << "EOF" > rootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
        EOF'

        echo "--> Criando serviço que salva diagnóstico (dmesg, USB, input) no cartão SD"
        echo "--> a cada boot — assim dá pra ler no PC sem precisar de serial/rede/solda."
        sudo bash -c 'cat << "EOF" > rootfs/usr/local/bin/dump-diagnostico.sh
        #!/bin/sh
        # Espera alguns segundos pro boot terminar e USB ter tempo de negociar
        sleep 15
        OUT=/boot/diagnostico.txt
        {
          echo "===== $(date) ====="
          echo
          echo "----- dmesg (log do kernel) -----"
          dmesg
          echo
          echo "----- /proc/bus/input/devices (botoes/analogico) -----"
          cat /proc/bus/input/devices
          echo
          echo "----- lsmod (modulos carregados) -----"
          lsmod
          echo
          echo "----- /sys/class/udc (controlador USB em modo gadget) -----"
          ls -la /sys/class/udc/ 2>&1
          echo
          echo "----- ip addr (interfaces de rede) -----"
          ip addr
          echo
          echo "----- journalctl -u kodi (ultimas 100 linhas) -----"
          journalctl -u kodi -n 100 --no-pager
        } > "$OUT" 2>&1
        EOF'
        sudo chmod +x rootfs/usr/local/bin/dump-diagnostico.sh

        sudo bash -c 'cat << "EOF" > rootfs/etc/systemd/system/dump-diagnostico.service
        [Unit]
        Description=Salva diagnostico de boot no cartao SD (boot partition)
        After=multi-user.target

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/dump-diagnostico.sh

        [Install]
        WantedBy=multi-user.target
        EOF'
        sudo chroot rootfs systemctl enable dump-diagnostico.service

        echo "--> Garantindo que a partição de boot (FAT) esteja montada em /boot no sistema,"
        echo "--> senão o script acima não tem onde escrever:"
        sudo bash -c 'echo "LABEL=BOOT /boot vfat defaults 0 0" >> rootfs/etc/fstab'
        sudo mkdir -p rootfs/boot

        echo "--> Instalando Kodi (GBM, sem X11) e dependências gráficas/áudio..."
        sudo chroot rootfs bash -c '
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            kodi kodi-bin kodi-peripheral-joystick \
            libgl1-mesa-dri libegl-mesa0 libgbm1 libgles2 libinput10 \
            evtest \
            alsa-utils dbus ca-certificates
          apt-get clean
          rm -rf /var/lib/apt/lists/*
        '

        echo "--> Confirmando suporte a --windowing=gbm no Kodi deste Debian:"
        sudo chroot rootfs kodi.bin --help 2>&1 | grep -i 'windowing' || \
          echo "(Não foi possível confirmar via --help, mas o pacote bookworm documenta suporte a gbm/wayland/x11 no mesmo binário.)"

        echo "--> Criando serviço systemd do Kodi (tela cheia via DRM/GBM no tty1)..."
        sudo bash -c 'cat << "EOF" > rootfs/etc/systemd/system/kodi.service
        [Unit]
        Description=Kodi Media Center (GBM)
        After=systemd-user-sessions.service systemd-udev-settle.service sound.target
        Conflicts=getty@tty1.service
        After=getty@tty1.service

        [Service]
        User=root
        Environment=HOME=/root
        Environment=KODI_AE_SINK=ALSA
        TTYPath=/dev/tty1
        StandardInput=tty
        StandardOutput=journal
        ExecStart=/usr/bin/kodi --standalone --windowing=gbm
        Restart=always
        RestartSec=3

        [Install]
        WantedBy=multi-user.target
        EOF'
        sudo chroot rootfs systemctl enable kodi.service

        echo "--> Instalando módulos do kernel no RootFS..."
        cd kernel
        sudo make ARCH=arm64 INSTALL_MOD_PATH=../rootfs modules_install
        cd ..

    - name: Create SD Card Image (.img)
      run: |
        sudo bash << 'EOF'
        set -e

        IMAGE_NAME="rk3566-x55-mainline-sdcard.img"
        IMAGE_SIZE_MB=4096

        echo "--> Criando arquivo de imagem vazio (${IMAGE_SIZE_MB}MB)..."
        dd if=/dev/zero of=${IMAGE_NAME} bs=1M count=${IMAGE_SIZE_MB} status=progress

        echo "--> Criando tabela de partições MBR..."
        parted -s ${IMAGE_NAME} mklabel msdos
        parted -s ${IMAGE_NAME} mkpart primary fat32 16MiB 144MiB
        parted -s ${IMAGE_NAME} mkpart primary ext4 144MiB 100%

        echo "--> Mapeando partições para loop devices..."
        LOOP_DEV=$(losetup -fP --show ${IMAGE_NAME})
        BOOT_DEV="${LOOP_DEV}p1"
        ROOT_DEV="${LOOP_DEV}p2"

        echo "--> Formatando partições..."
        mkfs.vfat -F 32 -n "BOOT" ${BOOT_DEV}
        mkfs.ext4 -F -L "ROOTFS" ${ROOT_DEV}

        echo "--> Gravando U-Boot mainline nos setores corretos..."
        # idbloader.img: SPL/TPL -> setor 64  (offset 32KB)
        # u-boot.itb:    U-Boot proper -> setor 16384 (offset 8MB)
        dd if=uboot/idbloader.img of=${LOOP_DEV} seek=64 conv=notrunc,fsync
        dd if=uboot/u-boot.itb of=${LOOP_DEV} seek=16384 conv=notrunc,fsync

        echo "--> Montando partições..."
        mkdir -p /mnt/boot /mnt/rootfs
        mount ${BOOT_DEV} /mnt/boot
        mount ${ROOT_DEV} /mnt/rootfs

        echo "--> Copiando kernel e device trees (X55 + X35S/X35H)..."
        cp kernel/arch/arm64/boot/Image /mnt/boot/
        mkdir -p /mnt/boot/dtbs
        cp kernel/arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dtb /mnt/boot/dtbs/
        cp kernel/arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dtb /mnt/boot/dtbs/ 2>/dev/null || \
          echo "!!! rk3566-powkiddy-x35s.dtb não encontrado neste kernel — X35S/X35H ficarão sem suporte nesta imagem."

        echo "--> Criando extlinux.conf (padrão: X35H/X35S — troque a linha FDT p/ X55)..."
        mkdir -p /mnt/boot/extlinux
        cat << "BOOTCFG" > /mnt/boot/extlinux/extlinux.conf
        LABEL Mainline (Powkiddy X35H / X35S)
            KERNEL /Image
            FDT /dtbs/rk3566-powkiddy-x35s.dtb
            APPEND quiet rootwait earlycon=uart8250,mmio32,0xfe660000 console=ttyS2,1500000n8 console=tty1 root=/dev/mmcblk1p2 rw
        BOOTCFG

        # Referência p/ X55: mesma imagem, só troca o FDT. Salvamos como
        # arquivo à parte (não ativo) — é só copiar o conteúdo por cima do
        # extlinux.conf se o aparelho for a X55.
        cat << "BOOTCFG2" > /mnt/boot/extlinux/extlinux.conf.x55
        LABEL Mainline (Powkiddy X55)
            KERNEL /Image
            FDT /dtbs/rk3566-powkiddy-x55.dtb
            APPEND quiet rootwait earlycon=uart8250,mmio32,0xfe660000 console=ttyS2,1500000n8 console=tty1 root=/dev/mmcblk1p2 rw
        BOOTCFG2

        echo "--> Copiando rootfs..."
        cp -a rootfs/* /mnt/rootfs/

        echo "--> Desmontando e limpando..."
        umount /mnt/boot
        umount /mnt/rootfs
        losetup -d ${LOOP_DEV}

        echo "--> Compactando imagem final..."
        gzip -f ${IMAGE_NAME}
        EOF

    - name: Prepare Output Directory
      run: |
        mkdir -p output
        mv rk3566-x55-mainline-sdcard.img.gz output/

    - name: Upload SD Card Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rk3566-x55-mainline-sdcard-image
        path: output/rk3566-x55-mainline-sdcard.img.gz
