name: Build Custom RK3566 OS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          bison flex libssl-dev bc libncurses5-dev libncursesw5-dev kmod u-boot-tools \
          squashfs-tools genext2fs mtools dosfstools rsync git wget python3

    - name: Fetch Sources (U-Boot & Kernel)
      run: |
        git clone --depth 1 https://github.com/TheGammaSqueeze/jelos_rk3566-x55-uboot.git uboot
        git clone --depth 1 https://github.com/TheGammaSqueeze/jelos_rk3566-x55-kernel.git kernel

    - name: Build U-Boot
      run: |
        cd uboot
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # Procura o arquivo defconfig correto para rk3566 no diretório de configs
        UBOOT_CONFIG=$(ls configs/*rk3566* 2>/dev/null | head -n 1 | xargs -n1 basename)
        if [ -z "$UBOOT_CONFIG" ]; then
          # Fallback caso não ache com a palavra rk3566
          UBOOT_CONFIG="evb-rk3566_defconfig"
        fi
        echo "Usando U-Boot Config: $UBOOT_CONFIG"
        make $UBOOT_CONFIG
        make -j$(nproc)

    - name: Build Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # Procura o arquivo defconfig do rk3566 no kernel
        KERNEL_CONFIG=$(ls arch/arm64/configs/*rk3566* arch/arm64/configs/*x55* 2>/dev/null | head -n 1 | xargs -n1 basename)
        if [ -z "$KERNEL_CONFIG" ]; then
          KERNEL_CONFIG="defconfig"
        fi
        echo "Usando Kernel Config: $KERNEL_CONFIG"
        make $KERNEL_CONFIG
        make -j$(nproc) Image dtbs modules
