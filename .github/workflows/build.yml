name: Build Custom RK3566 OS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          bison flex libssl-dev bc libncurses-dev kmod u-boot-tools \
          squashfs-tools genext2fs mtools dosfstools rsync git wget \
          python3 python3-pyelftools python3-setuptools device-tree-compiler \
          swig libelf-dev libgnutls28-dev

    - name: Fetch Sources (U-Boot, Kernel & RKBIN)
      run: |
        # Clona o uboot, kernel e o repositório rkbin necessário para o ./make.sh do U-Boot
        git clone --depth 1 https://github.com/TheGammaSqueeze/jelos_rk3566-x55-uboot.git uboot
        git clone --depth 1 https://github.com/TheGammaSqueeze/jelos_rk3566-x55-kernel.git kernel
        git clone --depth 1 https://github.com/rockchip-linux/rkbin.git rkbin

    - name: Build U-Boot
      run: |
        cd uboot
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export HOSTCFLAGS="-Wno-error -O2"
        export CFLAGS="-Wno-error"

        chmod +x make.sh
        
        # Tenta o alvo especifico 'x55' ou fallback para 'rk3566' se x55 nao existir no script
        if grep -q "x55" make.sh; then
          echo "--> Executando ./make.sh x55"
          ./make.sh x55
        else
          echo "--> Executando ./make.sh rk3566"
          ./make.sh rk3566
        fi

    - name: Build Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export HOSTCFLAGS="-Wno-error -O2"
        export KCFLAGS="-Wno-error"

        KERNEL_CONFIG_PATH=$(find arch/arm64/configs -maxdepth 1 -iname '*defconfig' \
          \( -iname '*rk3566*' -o -iname '*x55*' \) \
          2>/dev/null | sort | head -n 1)

        if [ -z "$KERNEL_CONFIG_PATH" ]; then
          echo "--> Usando defconfig padrão como fallback."
          KERNEL_CONFIG="defconfig"
        else
          KERNEL_CONFIG=$(basename "$KERNEL_CONFIG_PATH")
        fi

        echo "--> Usando Kernel Config: $KERNEL_CONFIG"
        make "$KERNEL_CONFIG"
        make -j"$(nproc)" Image dtbs modules

    - name: Assemble RootFS Structure
      run: |
        mkdir -p rootfs/{bin,sbin,dev,proc,sys,etc/init.d,mnt,usr/bin,usr/lib}

        cat << 'EOF' > rootfs/etc/init.d/rcS
        #!/bin/sh
        mount -t proc proc /proc
        mount -t sysfs sysfs /sys
        mount -t devtmpfs devtmpfs /dev
        echo "Sistema RK3566 inicializado com sucesso!"
        EOF

        chmod +x rootfs/etc/init.d/rcS

    - name: Prepare Artifacts
      run: |
        mkdir -p output
        # Copia todos os binarios de boot gerados pelo make.sh do Rockchip
        cp uboot/*loader*.bin output/ 2>/dev/null || true
        cp uboot/*uboot*.bin output/ 2>/dev/null || true
        cp uboot/uboot.img output/ 2>/dev/null || true
        cp uboot/trust.img output/ 2>/dev/null || true
        cp uboot/idbloader.img output/ 2>/dev/null || true
        cp kernel/arch/arm64/boot/Image output/ 2>/dev/null || true
        mkdir -p output/dtbs
        cp kernel/arch/arm64/boot/dts/rockchip/*.dtb output/dtbs/ 2>/dev/null || true

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rk3566-build-output
        path: output/name: Build Custom RK3566 OS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          bison flex libssl-dev bc libncurses-dev kmod u-boot-tools \
          squashfs-tools genext2fs mtools dosfstools rsync git wget \
          python3 python3-pyelftools python3-setuptools device-tree-compiler \
          swig libelf-dev libgnutls28-dev

    - name: Fetch Sources (U-Boot & Kernel)
      run: |
        git clone --depth 1 https://github.com/TheGammaSqueeze/jelos_rk3566-x55-uboot.git uboot
        git clone --depth 1 https://github.com/TheGammaSqueeze/jelos_rk3566-x55-kernel.git kernel

    - name: Inspect U-Boot Repo Structure
      run: |
        echo "===== Raiz do repositório uboot/ ====="
        ls -la uboot/
        echo
        if [ -f uboot/make.sh ]; then
          echo "===== uboot/make.sh encontrado! Conteúdo: ====="
          cat uboot/make.sh
        else
          echo "Nenhum make.sh na raiz — provavelmente usa o fluxo padrão 'make <defconfig>'."
        fi
        echo
        echo "===== Defconfigs relacionados a Rockchip/RK35xx/x55 em uboot/configs ====="
        find uboot/configs -maxdepth 1 -iname '*defconfig' 2>/dev/null \
          | grep -iE 'rockchip|rk3|evb|x55|powkiddy' | sort || echo "(nenhum)"

    - name: Build U-Boot
      run: |
        cd uboot
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # Desativa avisos estritos do GCC 12/13/14 para não quebrar no kconfig/symbol.c
        export HOSTCFLAGS="-Wno-error -O2"
        export CFLAGS="-Wno-error"

        if [ -f make.sh ]; then
          # Este fork é um BSP downstream da Rockchip: não usa "make <defconfig>",
          # e sim um script próprio (ex: ./make.sh rk3566). O passo anterior
          # ("Inspect U-Boot Repo Structure") já imprimiu o conteúdo do make.sh
          # no log — confirme ali qual argumento de board ele espera.
          chmod +x make.sh
          echo "--> Tentando ./make.sh rk3566"
          set +e
          ./make.sh rk3566
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "!!! ./make.sh rk3566 falhou (status $STATUS)."
            echo "!!! Veja o log do step 'Inspect U-Boot Repo Structure' para o conteúdo"
            echo "!!! real do make.sh e me envie para eu ajustar o argumento correto"
            echo "!!! (ex: ./make.sh x55, ./make.sh powkiddy-x55, etc)."
            exit 1
          fi
          # Alguns forks precisam de um segundo passo para gerar o trust.img
          ./make.sh trust || true
        else
          # Fallback: fluxo padrão de Kconfig do U-Boot mainline
          UBOOT_CONFIG_PATH=$(find configs -maxdepth 1 -iname '*defconfig' \
            \( -iname '*rk3566*' -o -iname '*x55*' -o -iname '*rg3566*' -o -iname '*powkiddy*' \) \
            2>/dev/null | sort | head -n 1)

          if [ -z "$UBOOT_CONFIG_PATH" ]; then
            echo "Nenhum defconfig específico encontrado. Listando defconfigs relacionados a Rockchip:"
            find configs -maxdepth 1 -iname '*defconfig' | grep -iE 'rockchip|rk3|evb' | sort
            exit 1
          fi

          UBOOT_CONFIG=$(basename "$UBOOT_CONFIG_PATH")
          echo "--> Usando U-Boot Config: $UBOOT_CONFIG"
          make "$UBOOT_CONFIG"
          make -j"$(nproc)"
        fi

    - name: Build Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export HOSTCFLAGS="-Wno-error -O2"
        export KCFLAGS="-Wno-error"

        KERNEL_CONFIG_PATH=$(find arch/arm64/configs -maxdepth 1 -iname '*defconfig' \
          \( -iname '*rk3566*' -o -iname '*x55*' \) \
          2>/dev/null | sort | head -n 1)

        if [ -z "$KERNEL_CONFIG_PATH" ]; then
          echo "Defconfig específico não encontrado. Listando defconfigs disponíveis:"
          find arch/arm64/configs -maxdepth 1 -iname '*defconfig' | sort
          echo "--> Usando defconfig padrão como fallback."
          KERNEL_CONFIG="defconfig"
        else
          KERNEL_CONFIG=$(basename "$KERNEL_CONFIG_PATH")
        fi

        echo "--> Usando Kernel Config: $KERNEL_CONFIG"
        make "$KERNEL_CONFIG"
        make -j"$(nproc)" Image dtbs modules

    - name: Assemble RootFS Structure
      run: |
        mkdir -p rootfs/{bin,sbin,dev,proc,sys,etc/init.d,mnt,usr/bin,usr/lib}

        # Script de inicialização minimalista
        cat << 'EOF' > rootfs/etc/init.d/rcS
        #!/bin/sh
        mount -t proc proc /proc
        mount -t sysfs sysfs /sys
        mount -t devtmpfs devtmpfs /dev
        echo "Sistema RK3566 inicializado com sucesso!"
        EOF

        chmod +x rootfs/etc/init.d/rcS

    - name: Prepare Artifacts
      run: |
        mkdir -p output
        [ -f uboot/u-boot.bin ] && cp uboot/u-boot.bin output/ || true
        [ -f uboot/idbloader.img ] && cp uboot/idbloader.img output/ || true
        [ -f kernel/arch/arm64/boot/Image ] && cp kernel/arch/arm64/boot/Image output/ || true
        mkdir -p output/dtbs
        cp kernel/arch/arm64/boot/dts/rockchip/*.dtb output/dtbs/ 2>/dev/null || true

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rk3566-build-output
        path: output/
