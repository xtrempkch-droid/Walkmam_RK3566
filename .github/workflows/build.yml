name: Build Mainline RK3566 (Powkiddy X55) OS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          bison flex libssl-dev bc libncurses-dev kmod u-boot-tools \
          device-tree-compiler python3 python3-dev python3-pyelftools python3-setuptools \
          swig libelf-dev libgnutls28-dev rsync git wget \
          parted kpartx e2fsprogs dosfstools qemu-user-static debootstrap

    # Kernel mainline: rk3566-powkiddy-x55.dts existe a partir da tag v6.8.
    # Usamos uma tag estável recente que já contenha o suporte.
    - name: Fetch Sources (Mainline U-Boot, Mainline Kernel & RKBIN)
      run: |
        git clone --depth 1 https://source.denx.de/u-boot/u-boot.git uboot
        git clone --depth 1 --branch v6.12 https://github.com/torvalds/linux.git kernel
        git clone --depth 1 https://github.com/rockchip-linux/rkbin.git rkbin

    - name: Build Mainline U-Boot
      run: |
        cd uboot
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        make powkiddy-x55-rk3566_defconfig

        # Versões de blob confirmadas no options da ROCKNIX para RK3566-X55
        # (projects/Rockchip/devices/RK3566-X55/options)
        BL31="../rkbin/bin/rk35/rk3568_bl31_v1.43.elf"
        TPL="../rkbin/bin/rk35/rk3566_ddr_1056MHz_v1.18.bin"

        if [ ! -f "$BL31" ] || [ ! -f "$TPL" ]; then
          echo "!!! Versão exata não encontrada no rkbin atual, usando a mais recente disponível como fallback:"
          BL31=$(ls ../rkbin/bin/rk35/rk3568_bl31_v*.elf | sort -V | tail -n1)
          TPL=$(ls ../rkbin/bin/rk35/rk3566_ddr_1056MHz_v*.bin | sort -V | tail -n1)
        fi
        echo "--> BL31=$BL31"
        echo "--> DDR/TPL=$TPL"

        make BL31="$BL31" ROCKCHIP_TPL="$TPL" -j"$(nproc)"

        echo "--> Artefatos gerados em uboot/:"
        ls -la idbloader.img u-boot.itb u-boot-rockchip.bin 2>/dev/null || true

    - name: Fetch ROCKNIX Config & Patches (RK3566 family - X55 / X35S / X35H)
      run: |
        # A ROCKNIX mantém, no próprio repositório open-source, o .config de
        # kernel e os patches/dts de device-tree já testados e funcionando
        # nessa família de placas. Buscamos aqui em vez de adivinhar.
        #
        # IMPORTANTE: diferente da X55 (que está no Linux mainline), a X35S/
        # X35H NUNCA foi enviada ao mainline — só existe como fonte própria da
        # ROCKNIX. Por isso a busca aqui é ampla (qualquer arquivo com "x35"
        # no nome, não só *.patch).
        git clone --depth 1 https://github.com/ROCKNIX/distribution.git rocknix-src

        echo "--> Localizando linux.aarch64.conf (RK3566, comum a toda a família)..."
        ROCKNIX_KCONFIG=$(find rocknix-src -path '*RK3566*/linux/linux.aarch64.conf' | head -n1)
        echo "Encontrado: $ROCKNIX_KCONFIG"
        cp "$ROCKNIX_KCONFIG" rocknix-kernel.config

        echo "--> Localizando QUALQUER arquivo relacionado a X55/X35S no repositório inteiro..."
        mkdir -p rocknix-patches rocknix-dts
        # (sem restringir a caminhos com "linux" — a ROCKNIX guarda config de
        # cada aparelho em pastas como devices/RK3566-X55/, sem essa palavra)
        find rocknix-src \( -iname '*x55*' -o -iname '*x35*' \) -type f | sort | tee /tmp/x35-files.txt

        echo "--> Conteúdo do arquivo 'options' da X35S/X35H (confirma o nome real do .dtb esperado)..."
        X35_OPTIONS=$(grep -i 'x35' /tmp/x35-files.txt | grep -i 'options$' | head -n1)
        if [ -n "$X35_OPTIONS" ]; then
          echo "Arquivo: $X35_OPTIONS"
          cat "$X35_OPTIONS"
        else
          echo "Nenhum arquivo 'options' específico de X35S/X35H encontrado."
        fi

        # Separa por tipo: patches vão para aplicar com git apply,
        # .dts/.dtsi novos vão direto para dentro da árvore do kernel.
        while read -r f; do
          case "$f" in
            *.patch) cp "$f" rocknix-patches/ ;;
            *.dts|*.dtsi) cp "$f" rocknix-dts/ ;;
          esac
        done < /tmp/x35-files.txt

        echo "--> Patches encontrados:"; ls -la rocknix-patches/ 2>/dev/null
        echo "--> Arquivos .dts/.dtsi encontrados:"; ls -la rocknix-dts/ 2>/dev/null

        echo "--> Localizando o driver compartilhado panel-generic-dsi.c (usado por RK3326/RK3566/RK3576)..."
        # Esse driver NÃO fica na pasta do dispositivo (não tem "x35"/"x55" no
        # nome) — é injetado direto pelo script de build deles a partir de um
        # local comum em projects/ROCKNIX/packages/linux/.
        GENERIC_DSI_C=$(find rocknix-src -iname 'panel-generic-dsi.c' | head -n1)
        echo "Encontrado: $GENERIC_DSI_C"
        if [ -n "$GENERIC_DSI_C" ]; then
          cp "$GENERIC_DSI_C" rocknix-panel-generic-dsi.c
        fi

        echo "--> Localizando o package.mk do kernel da ROCKNIX (mostra como eles registram o driver)..."
        LINUX_PKGMK=$(find rocknix-src -path '*packages/linux/package.mk' | head -n1)
        echo "Encontrado: $LINUX_PKGMK"
        if [ -n "$LINUX_PKGMK" ]; then
          echo "--> Trecho relevante (post_patch / panel-generic-dsi / joypad):"
          grep -n -B2 -A20 'generic-dsi\|post_patch\|joypad' "$LINUX_PKGMK" | head -n 150
          cp "$LINUX_PKGMK" rocknix-linux-package.mk
        fi

        echo "--> Baixando a revisão do driver rocknix-joypad usada para adaptar o X55."
        git init rocknix-joypad-src
        git -C rocknix-joypad-src fetch --depth 1 \
          https://github.com/ROCKNIX/rocknix-joypad.git \
          d02ed13aae08113f6f9e0e9d699cb29bb3450fa2
        git -C rocknix-joypad-src checkout --detach FETCH_HEAD
        ls -la rocknix-joypad-src/ 2>/dev/null

    - name: Build Mainline Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        echo "--> Aplicando patches de DTS da X55/X35S (SDIO fix / overclock / etc)..."
        for p in ../rocknix-patches/*.patch; do
          [ -f "$p" ] || continue
          echo "Aplicando $p"
          git apply --reject --whitespace=fix "$p" || echo "!!! Falhou ao aplicar $p, verifique manualmente (pode já não bater com esta versão do kernel)."
        done

        echo "--> Garantindo que todo .dts novo (via patch ou cópia direta) está registrado no Makefile..."
        # Copia primeiro os .dts/.dtsi que vieram soltos (não via patch)
        if ls ../rocknix-dts/*.dts* >/dev/null 2>&1; then
          cp ../rocknix-dts/*.dts* arch/arm64/boot/dts/rockchip/
        fi

        MAKEFILE="arch/arm64/boot/dts/rockchip/Makefile"
        for dtsfile in arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35*.dts \
                       arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dts; do
          [ -f "$dtsfile" ] || continue
          base=$(basename "$dtsfile" .dts)
          if grep -q "${base}\.dtb" "$MAKEFILE"; then
            echo "--> ${base}.dtb já registrado no Makefile"
          else
            echo "--> Registrando ${base}.dtb no Makefile do rockchip (não estava lá — provavelmente veio via patch que só adiciona o .dts)"
            echo "dtb-\$(CONFIG_ARCH_ROCKCHIP) += ${base}.dtb" >> "$MAKEFILE"
          fi
        done

        echo "--> Normalizando a configuração do joypad do X55 para um único nó ROCKNIX."
        python3 ../build/configure-x55-dts.py arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dts
        if ! grep -q $'^\tjoypad: rocknix-joypad {' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dts; then
          echo "O nó rocknix-joypad precisa ser filho direto da raiz do device tree." >&2
          exit 1
        fi
        if grep -q $'^\t\tjoypad: rocknix-joypad {' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dts; then
          echo "O nó rocknix-joypad não pode ficar aninhado em outro dispositivo." >&2
          exit 1
        fi

        echo "--> A X35S/X35H não tem porta HDMI física — desabilitando o nó HDMI do SoC no"
        echo "--> .dts antes de compilar (se ficasse habilitado, o Kodi em modo GBM poderia"
        echo "--> escolher esse conector 'fantasma' em vez do painel, deixando a tela preta)."
        if [ -f arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts ]; then
          printf '\n&hdmi {\n\tstatus = "disabled";\n};\n' >> arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts
        fi

        echo "--> Desabilitando HDMI no X55 para testar o workaround de tela preta."
        if [ -f arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dts ]; then
          printf '\n&hdmi {\n\tstatus = "disabled";\n};\n' >> arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dts
        fi

        echo "--> Checando modo da porta USB (precisa ser 'otg'/'peripheral', não fixo em 'host',"
        echo "--> pra podermos usar 'USB gadget ethernet' e fazer SSH sem WiFi/Bluetooth)..."
        grep -n 'dr_mode' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts || \
          echo "--> Nenhum 'dr_mode' explícito no .dts da X35S (provavelmente herda do .dtsi base — ok na maioria dos casos, a ROCKNIX confirma suporte a gadget nessa família)."

        echo "--> DIAGNÓSTICO: conteúdo COMPLETO do rk3566-powkiddy-x35s.dts (pra achar"
        echo "--> se existe nó de botões/analógico que não está sendo reconhecido, ou se"
        echo "--> realmente não existe no patch que a ROCKNIX nos deu):"
        cat -n arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts

        echo "--> Usando o .config real da ROCKNIX para RK3566 como base..."
        cp ../rocknix-kernel.config .config

        # O .config da ROCKNIX usa "@INITRAMFS_SOURCE@" como placeholder de
        # template, preenchido pelo build system deles (LibreELEC-based) antes
        # de compilar. Aqui não temos esse pipeline, e como usamos rootfs em
        # partição separada (não initramfs embutido), zeramos esse campo.
        ./scripts/config --set-str INITRAMFS_SOURCE ""

        make olddefconfig

        echo "--> Integrando o driver panel-generic-dsi.c (compartilhado, fora da árvore mainline)..."
        if [ -f ../rocknix-panel-generic-dsi.c ]; then
          cp ../rocknix-panel-generic-dsi.c drivers/gpu/drm/panel/panel-generic-dsi.c

          # Tenta descobrir o nome real da CONFIG_ que a ROCKNIX usa, lendo
          # do próprio package.mk deles em vez de chutar.
          GENERIC_DSI_CONFIG=""
          if [ -f ../rocknix-linux-package.mk ]; then
            GENERIC_DSI_CONFIG=$(grep -oP 'CONFIG_DRM_PANEL_\w*GENERIC\w*' ../rocknix-linux-package.mk | sort -u | head -n1)
          fi
          if [ -z "$GENERIC_DSI_CONFIG" ]; then
            GENERIC_DSI_CONFIG="CONFIG_DRM_PANEL_GENERIC_DSI"
            echo "!!! Não achei o nome exato da CONFIG no package.mk, usando o padrão: $GENERIC_DSI_CONFIG"
          else
            echo "--> Nome real encontrado no package.mk: $GENERIC_DSI_CONFIG"
          fi
          CFG_SYMBOL=${GENERIC_DSI_CONFIG#CONFIG_}

          if ! grep -q "config ${CFG_SYMBOL}$" drivers/gpu/drm/panel/Kconfig; then
            echo "--> Registrando ${CFG_SYMBOL} no Kconfig..."
            KCONFIG_BLOCK=$'\nconfig '"${CFG_SYMBOL}"$'\n\ttristate "Generic MIPI-DSI panel (ROCKNIX)"\n\tdepends on OF\n\tdepends on DRM_MIPI_DSI\n\tdepends on BACKLIGHT_CLASS_DEVICE\n\tselect DRM_KMS_HELPER\n\thelp\n\t  Driver generico de painel MIPI-DSI controlado via sequencia de\n\t  inicializacao declarada no device tree (panel_description).\n'
            if grep -q '^endmenu' drivers/gpu/drm/panel/Kconfig; then
              awk -v block="$KCONFIG_BLOCK" '/^endmenu/ && !done {print block; done=1} {print}' \
                drivers/gpu/drm/panel/Kconfig > /tmp/Kconfig.new
              mv /tmp/Kconfig.new drivers/gpu/drm/panel/Kconfig
            else
              printf '%s\n' "$KCONFIG_BLOCK" >> drivers/gpu/drm/panel/Kconfig
            fi
          else
            echo "--> ${CFG_SYMBOL} já estava no Kconfig"
          fi

          if ! grep -q "panel-generic-dsi.o" drivers/gpu/drm/panel/Makefile; then
            echo "--> Registrando no Makefile..."
            echo "obj-\$(${GENERIC_DSI_CONFIG}) += panel-generic-dsi.o" >> drivers/gpu/drm/panel/Makefile
          else
            echo "--> Já estava registrado no Makefile"
          fi

          echo "--> Habilitando ${GENERIC_DSI_CONFIG} no .config..."
          ./scripts/config --enable "$CFG_SYMBOL"
          make olddefconfig
        else
          echo "!!! panel-generic-dsi.c NÃO foi encontrado no repositório da ROCKNIX."
          echo "!!! Sem ele, o painel da X35S/X35H não vai inicializar (mesmo com o .dtb certo),"
          echo "!!! porque o compatible \"rocknix,generic-dsi\" não tem driver nenhum."
        fi

        echo "--> Integrando o driver de botões/analógico (rocknix-joypad)..."
        if [ ! -f ../rocknix-joypad-src/rocknix-joypad.c ]; then
          echo "Driver ROCKNIX joypad não foi baixado." >&2
          exit 1
        fi
        cp ../build/rocknix-input-polldev-compat.h include/linux/input-polldev.h
        mkdir -p drivers/input/joystick
        cp ../rocknix-joypad-src/rocknix-joypad.c \
           ../rocknix-joypad-src/rocknix-joypad.h \
           drivers/input/joystick/

        if ! grep -q '^config JOYSTICK_ROCKNIX$' drivers/input/joystick/Kconfig; then
          BLOCK=$'\nconfig JOYSTICK_ROCKNIX\n\ttristate "ROCKNIX joypad driver"\n\tdepends on INPUT && IIO\n\thelp\n\t  ROCKNIX gamepad driver for GPIO buttons and ADC axes.\n'
          awk -v block="$BLOCK" '/^endif/ && !done {print block; done=1} {print}' \
            drivers/input/joystick/Kconfig > /tmp/Kconfig.new
          mv /tmp/Kconfig.new drivers/input/joystick/Kconfig
        fi
        if ! grep -q 'rocknix-joypad.o' drivers/input/joystick/Makefile; then
          echo 'obj-$(CONFIG_JOYSTICK_ROCKNIX) += rocknix-joypad.o' >> \
            drivers/input/joystick/Makefile
        fi
        ./scripts/config --enable INPUT_JOYSTICK
        ./scripts/config --enable JOYSTICK_ROCKNIX
        make olddefconfig
        grep -qx 'CONFIG_INPUT_JOYSTICK=y' .config
        grep -qx 'CONFIG_JOYSTICK_ROCKNIX=y' .config

        # "make dtbs" compila TODOS os device trees da plataforma Rockchip de
        # uma vez (não é filtrado por defconfig) — então X55 e X35S saem
        # juntos aqui, sem precisar de nenhum passo extra.
        make -j"$(nproc)" Image dtbs modules

        echo "--> Verificando se os dtbs da X55 e X35S foram gerados:"
        find arch/arm64/boot/dts/rockchip -iname '*powkiddy-x55*' -o -iname '*powkiddy-x35s*'

        echo "--> USB: NÃO forçamos mais dr_mode. O gadget funciona no X55, que usa o"
        echo "--> padrão 'otg' do SoC (rk356x-base.dtsi); forçar 'peripheral' nos DTBs da"
        echo "--> X35S (o que este workflow fazia) era a única diferença de USB entre a"
        echo "--> imagem que funciona (X55) e a que falha (X35H)."
        X55_DTB_PATH=arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dtb
        if [ -f "$X55_DTB_PATH" ]; then
          echo "--> [USB] dr_mode no DTB da X55 (referência que funciona):"
          dtc -I dtb -O dts "$X55_DTB_PATH" 2>/dev/null | grep -A5 'usb@fcc00000' || true
        fi
        DTB_PATH=arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dtb
        if [ -f "$DTB_PATH" ]; then
          echo "--> [USB] dr_mode no NOSSO DTB da X35S (não modificado):"
          dtc -I dtb -O dts "$DTB_PATH" 2>/dev/null | grep -A5 'usb@fcc00000' || true
        fi

        echo "--> DIAGNÓSTICO: tudo relacionado a 'panel' no rk3566-powkiddy-x35s.dts"
        grep -n -i -B2 -A10 'panel' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts || echo "Nada com 'panel' encontrado."

        echo "--> DIAGNÓSTICO: tudo relacionado a 'dsi' no rk3566-powkiddy-x35s.dts"
        grep -n -i -B2 -A10 'dsi' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts || echo "Nada com 'dsi' encontrado."

        echo "--> DIAGNÓSTICO: TODAS as linhas 'compatible' do arquivo"
        grep -n 'compatible' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts

        echo "--> DIAGNÓSTICO: esse(s) compatible existe(m) em drivers/gpu/drm/panel/?"
        for c in $(grep -oP 'compatible\s*=\s*"\K[^"]+' arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dts); do
          echo "-- checando: $c"
          grep -rl "$c" drivers/gpu/drm/panel/ 2>/dev/null || echo "   !!! não encontrado em nenhum driver de painel"
        done

        echo "--> DIAGNÓSTICO: drivers de painel habilitados no .config final"
        grep -i "PANEL" .config | grep '=y\|=m'

        echo "--> DIAGNÓSTICO: drivers de entrada (botões/analógico) habilitados no .config"
        echo "--> (esperado: JOYSTICK_ADC e KEYBOARD_GPIO, usados pelo adc-joystick/gpio-keys"
        echo "--> que a família RK3566 usa pros botões físicos)"
        grep -iE "JOYSTICK_ADC|KEYBOARD_GPIO|KEYBOARD_ADC|INPUT_ADC_KEYS" .config

        echo "--> Garantindo (forçando) que os drivers de botão estão habilitados,"
        echo "--> já que sem rede no aparelho não dá pra checar e corrigir remotamente:"
        ./scripts/config --enable JOYSTICK_ADC
        ./scripts/config --enable KEYBOARD_GPIO
        ./scripts/config --enable KEYBOARD_ADC
        ./scripts/config --enable INPUT_JOYSTICK
        ./scripts/config --enable INPUT_EVDEV

        echo "--> Habilitando USB gadget ethernet (g_ether) pra SSH via cabo USB-C,"
        echo "--> já que a X35H não tem WiFi/Bluetooth:"
        ./scripts/config --enable USB_GADGET
        ./scripts/config --module USB_ETH
        ./scripts/config --enable USB_LIBCOMPOSITE
        ./scripts/config --enable USB_DWC3
        ./scripts/config --enable USB_DWC3_DUAL_ROLE
        ./scripts/config --enable USB_ROLE_SWITCH

        make olddefconfig
        make -j"$(nproc)" Image modules

        if ! find arch/arm64/boot/dts/rockchip -iname '*powkiddy-x35s*' | grep -q .; then
          echo "!!! rk3566-powkiddy-x35s.dtb NÃO existe neste kernel (v6.12 mainline)."
          echo "!!! Isso confirma: suporte à X35S/X35H provavelmente não está upstream ainda,"
          echo "!!! só no fork/patches específicos da ROCKNIX. Sem esse .dtb, o U-Boot não"
          echo "!!! encontra o FDT e o aparelho fica com tela preta (nenhum 'sistema' visível)."
        fi

    - name: Fetch Official ROCKNIX .dtb (X35S) as authoritative reference
      run: |
        echo "--> Nosso .dts da X35S está incompleto (sem botões/analógico, USB com erro)."
        echo "--> Baixando o release oficial mais recente da ROCKNIX pra pegar o .dtb"
        echo "--> REAL e comprovadamente funcional que eles usam em produção."

        LATEST_JSON=$(curl -s https://api.github.com/repos/ROCKNIX/distribution/releases/latest)
        ASSET_URL=$(echo "$LATEST_JSON" | grep -oP '"browser_download_url":\s*"\K[^"]*RK3566[^"]*Specific\.img\.gz' | head -n1)
        echo "--> URL do asset encontrado: $ASSET_URL"

        if [ -z "$ASSET_URL" ]; then
          echo "!!! Não consegui achar o asset 'Specific' do RK3566 no release mais recente."
          echo "!!! Prosseguindo sem o .dtb de referência (fica só o nosso, incompleto)."
        else
          wget -q "$ASSET_URL" -O rocknix-release.img.gz
          gunzip -f rocknix-release.img.gz

          LOOP_DEV=$(sudo losetup -fP --show rocknix-release.img)
          sudo mkdir -p /mnt/rocknix-boot
          sudo mount "${LOOP_DEV}p1" /mnt/rocknix-boot

          echo "--> Procurando o .dtb da X35S dentro do release..."
          FOUND_DTB=$(sudo find /mnt/rocknix-boot -iname '*x35s*.dtb' | head -n1)
          echo "Encontrado: $FOUND_DTB"

          if [ -n "$FOUND_DTB" ]; then
            sudo cp "$FOUND_DTB" rocknix-official-x35s.dtb
            sudo chown $(id -u):$(id -g) rocknix-official-x35s.dtb

            echo "--> Decompilando pra inspeção (diagnóstico):"
            dtc -I dtb -O dts rocknix-official-x35s.dtb 2>/dev/null | grep -A3 -i 'joystick\|gpio-keys\|usbdrd\|usb2phy' | head -150

            echo "--> Esse .dtb tem DSI e HDMI habilitados ao mesmo tempo, competindo pelo"
            echo "--> mesmo VOP2 — isso trava a saída de vídeo (confirmado em teste real:"
            echo "--> 'Failed to register component: -517' + 'POST_BUF_EMPTY irq err at vp1')."
            echo "--> Desabilitando o nó hdmi@fe0a0000 e recompilando o .dtb:"
            dtc -I dtb -O dts -o rocknix-official-x35s.dts rocknix-official-x35s.dtb 2>/dev/null
            awk '
              /hdmi@fe0a0000[ \t]*\{/ { inblk=1; depth=1; print; next }
              inblk {
                n=gsub(/\{/,"{"); depth+=n
                n=gsub(/\}/,"}"); depth-=n
                if ($0 ~ /status = "okay";/) { sub(/status = "okay";/, "status = \"disabled\";") }
                print
                if (depth<=0) inblk=0
                next
              }
              { print }
            ' rocknix-official-x35s.dts > rocknix-official-x35s.dts.new
            mv rocknix-official-x35s.dts.new rocknix-official-x35s.dts
            dtc -I dts -O dtb -o rocknix-official-x35s.dtb rocknix-official-x35s.dts 2>&1 | tail -20
            echo "--> Confirmando que a mudança entrou:"
            dtc -I dtb -O dts rocknix-official-x35s.dtb 2>/dev/null | grep -A2 'hdmi@fe0a0000'

            echo "--> USB: NÃO forçamos dr_mode. Mantemos o valor do próprio .dtb (o SoC"
            echo "--> base usa 'otg', igual ao X55, onde o gadget funciona). O 'peripheral'"
            echo "--> que forçávamos aqui era a única diferença de USB entre as imagens."
            echo "--> [USB] dr_mode no .dtb oficial da ROCKNIX (não modificado):"
            dtc -I dtb -O dts rocknix-official-x35s.dtb 2>/dev/null | grep -A5 'usb@fcc00000' || true
          else
            echo "!!! .dtb da X35S não encontrado dentro do release (procure manualmente)."
            sudo find /mnt/rocknix-boot -iname '*.dtb' | sort
          fi

          sudo umount /mnt/rocknix-boot
          sudo losetup -d "$LOOP_DEV"
        fi

    - name: Build Minimal RootFS (Debian ARM64)
      run: |
        echo "--> Criando RootFS base Debian ARM64..."
        sudo debootstrap --arch=arm64 --foreign bookworm rootfs http://deb.debian.org/debian/
        sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/
        sudo chroot rootfs /debootstrap/debootstrap --second-stage

        echo "--> Pacotes básicos + acesso via console serial..."
        sudo chroot rootfs bash -c '
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            systemd-sysv udev ifupdown network-manager \
            openssh-server sudo nano
          echo "root:root" | chpasswd
          echo "rk3566-x55" > /etc/hostname
        '

        echo "--> Habilitando login automático no console serial (ttyS2)..."
        sudo mkdir -p rootfs/etc/systemd/system/serial-getty@ttyS2.service.d
        sudo bash -c 'cat << "EOF" > rootfs/etc/systemd/system/serial-getty@ttyS2.service.d/autologin.conf
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin root --keep-baud 1500000,115200,38400,9600 %I $TERM
        EOF'

        echo "--> Habilitando login automático na tela (tty1)..."
        sudo mkdir -p rootfs/etc/systemd/system/getty@tty1.service.d
        sudo bash -c 'cat << "EOF" > rootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
        EOF'

        echo "--> Instalando o script de diagnóstico (dmesg, USB, input) no cartão SD"
        echo "--> a cada boot — assim dá pra ler no PC sem precisar de serial/rede/solda."
        echo "--> (o script vem de variants/kodi/overlay; não é mais copiado inline aqui)"
        sudo install -D -m 0755 \
          variants/kodi/overlay/usr/local/bin/dump-diagnostico.sh \
          rootfs/usr/local/bin/dump-diagnostico.sh

        sudo bash -c 'cat << "EOF" > rootfs/etc/systemd/system/dump-diagnostico.service
        [Unit]
        Description=Salva diagnostico de boot no cartao SD (boot partition)
        After=multi-user.target

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/dump-diagnostico.sh

        [Install]
        WantedBy=multi-user.target
        EOF'
        sudo chroot rootfs systemctl enable dump-diagnostico.service

        echo "--> Criando serviço que ativa o USB gadget ethernet no boot (g_ether),"
        echo "--> já que o driver estava habilitado no kernel mas nunca era carregado."
        sudo bash -c 'cat << "EOF" > rootfs/usr/local/bin/setup-usb-gadget.sh
        #!/bin/sh
        # g_ether cria a interface usb0 sozinho ao carregar, sem precisar
        # montar configfs manualmente. host_addr/dev_addr fixos evitam MAC
        # aleatório (facilita configurar o lado do PC, se precisar).
        modprobe g_ether dev_addr=02:00:00:00:00:01 host_addr=02:00:00:00:00:02
        sleep 2
        ip link set dev usb0 up 2>/dev/null || true
        ip addr add 10.55.0.1/24 dev usb0 2>/dev/null || true
        EOF'
        sudo chmod +x rootfs/usr/local/bin/setup-usb-gadget.sh

        sudo bash -c 'cat << "EOF" > rootfs/etc/systemd/system/usb-gadget.service
        [Unit]
        Description=USB Ethernet Gadget (g_ether) para SSH via cabo USB-C
        After=sys-kernel-config.mount
        Before=ssh.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/setup-usb-gadget.sh
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target
        EOF'
        sudo chroot rootfs systemctl enable usb-gadget.service

        echo "--> Impedindo o NetworkManager de gerenciar a usb0 (senão ele pode"
        echo "--> sobrescrever o IP fixo que o script de gadget configurou)."
        sudo mkdir -p rootfs/etc/NetworkManager/conf.d
        sudo bash -c 'cat << "EOF" > rootfs/etc/NetworkManager/conf.d/99-unmanaged-usb0.conf
        [keyfile]
        unmanaged-devices=interface-name:usb0
        EOF'

        echo "--> Garantindo que a partição de boot (FAT) esteja montada em /boot no sistema,"
        echo "--> senão o script acima não tem onde escrever:"
        sudo bash -c 'echo "LABEL=BOOT /boot vfat defaults 0 0" >> rootfs/etc/fstab'
        sudo mkdir -p rootfs/boot

        echo "--> Instalando Kodi (GBM, sem X11) e dependências gráficas/áudio..."
        sudo chroot rootfs bash -c '
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            kodi kodi-bin kodi-peripheral-joystick \
            weston \
            libgl1-mesa-dri libegl-mesa0 libgbm1 libgles2 libinput10 \
            evtest \
            alsa-utils dbus ca-certificates
          apt-get clean
          rm -rf /var/lib/apt/lists/*
        '

        echo "--> Instalando o mapa de controles do gamepad ROCKNIX do X55 no Kodi..."
        sudo install -D -m 0644 \
          variants/kodi/overlay/usr/share/kodi/addons/peripheral.joystick/resources/buttonmaps/xml/linux/retrogame_joypad_17b_4a.xml \
          rootfs/usr/share/kodi/addons/peripheral.joystick/resources/buttonmaps/xml/linux/retrogame_joypad_17b_4a.xml

        echo "--> Configurando Weston para girar somente a sessão Kodi em DSI-1..."
        sudo install -D -m 0644 \
          variants/kodi/overlay/etc/xdg/weston/weston.ini \
          rootfs/etc/xdg/weston/weston.ini
        sudo install -D -m 0755 \
          variants/kodi/overlay/usr/local/bin/start-kodi-wayland.sh \
          rootfs/usr/local/bin/start-kodi-wayland.sh
        sudo install -D -m 0644 \
          variants/kodi/overlay/etc/systemd/system/kodi.service \
          rootfs/etc/systemd/system/kodi.service
        sudo chroot rootfs kodi.bin --help 2>&1 | grep -i 'windowing' || \
          echo "(Não foi possível confirmar via --help; a sessão será iniciada em Wayland.)"

        echo "--> Criando serviço Kodi em Weston/Wayland sobre DRM no tty1..."
        sudo chroot rootfs systemctl enable kodi.service

        echo "--> Instalando módulos do kernel no RootFS..."
        cd kernel
        sudo make ARCH=arm64 INSTALL_MOD_PATH=../rootfs modules_install
        cd ..

    - name: Create SD Card Image (.img)
      run: |
        sudo bash << 'EOF'
        set -e

        IMAGE_NAME="rk3566-x55-mainline-sdcard.img"
        IMAGE_SIZE_MB=4096

        echo "--> Criando arquivo de imagem vazio (${IMAGE_SIZE_MB}MB)..."
        dd if=/dev/zero of=${IMAGE_NAME} bs=1M count=${IMAGE_SIZE_MB} status=progress

        echo "--> Criando tabela de partições MBR..."
        parted -s ${IMAGE_NAME} mklabel msdos
        parted -s ${IMAGE_NAME} mkpart primary fat32 16MiB 144MiB
        parted -s ${IMAGE_NAME} mkpart primary ext4 144MiB 100%

        echo "--> Mapeando partições para loop devices..."
        LOOP_DEV=$(losetup -fP --show ${IMAGE_NAME})
        BOOT_DEV="${LOOP_DEV}p1"
        ROOT_DEV="${LOOP_DEV}p2"

        echo "--> Formatando partições..."
        mkfs.vfat -F 32 -n "BOOT" ${BOOT_DEV}
        mkfs.ext4 -F -L "ROOTFS" ${ROOT_DEV}

        echo "--> Gravando U-Boot mainline nos setores corretos..."
        # idbloader.img: SPL/TPL -> setor 64  (offset 32KB)
        # u-boot.itb:    U-Boot proper -> setor 16384 (offset 8MB)
        dd if=uboot/idbloader.img of=${LOOP_DEV} seek=64 conv=notrunc,fsync
        dd if=uboot/u-boot.itb of=${LOOP_DEV} seek=16384 conv=notrunc,fsync

        echo "--> Montando partições..."
        mkdir -p /mnt/boot /mnt/rootfs
        mount ${BOOT_DEV} /mnt/boot
        mount ${ROOT_DEV} /mnt/rootfs

        echo "--> Copiando kernel e device trees (X55 + X35S/X35H)..."
        cp kernel/arch/arm64/boot/Image /mnt/boot/
        mkdir -p /mnt/boot/dtbs
        cp kernel/arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x55.dtb /mnt/boot/dtbs/
        cp kernel/arch/arm64/boot/dts/rockchip/rk3566-powkiddy-x35s.dtb /mnt/boot/dtbs/rk3566-powkiddy-x35s-nosso.dtb 2>/dev/null || true

        X35S_DEFAULT="dtbs/rk3566-powkiddy-x35s-nosso.dtb"
        if [ -f rocknix-official-x35s.dtb ]; then
          echo "--> Usando o .dtb OFICIAL da ROCKNIX como padrão pra X35S/X35H (mais completo:"
          echo "--> tem botões/analógico e USB funcionando, confirmados no release deles)."
          cp rocknix-official-x35s.dtb /mnt/boot/dtbs/rk3566-powkiddy-x35s-rocknix.dtb
          X35S_DEFAULT="dtbs/rk3566-powkiddy-x35s-rocknix.dtb"
        else
          echo "!!! .dtb oficial da ROCKNIX não foi obtido — usando o nosso (incompleto: sem"
          echo "!!! botões/analógico, USB com erro de ep0out)."
        fi

        # Variante alternativa do DTB da X35S/X35H com dr_mode="peripheral" no
        # controlador USB (usb@fcc00000). É só para teste: o padrão continua sendo o
        # DTB original (dr_mode do SoC, 'otg'), igual ao X55, onde o gadget funciona.
        # Para usar esta variante: no PC (partição FAT), copie
        # extlinux/extlinux.conf.x35s-peripheral por cima de extlinux/extlinux.conf.
        X35S_DTB_FILE="/mnt/boot/${X35S_DEFAULT}"
        PERIPH_FDT=""
        if [ -f "$X35S_DTB_FILE" ]; then
          X35S_PERIPH="/mnt/boot/dtbs/$(basename "${X35S_DTB_FILE%.dtb}")-peripheral.dtb"
          if dtc -I dtb -O dts -o /tmp/x35s-periph.dts "$X35S_DTB_FILE" 2>/dev/null; then
            awk '
              /usb@fcc00000[ \t]*\{/ { inblk=1; depth=1; found=0; print; next }
              inblk {
                n=gsub(/\{/,"{"); depth+=n
                n=gsub(/\}/,"}"); depth-=n
                if ($0 ~ /dr_mode = /) { sub(/dr_mode = "[a-zA-Z]*";/, "dr_mode = \"peripheral\";"); found=1 }
                if (depth<=0 && !found) { print "\t\tdr_mode = \"peripheral\";" }
                print
                if (depth<=0) inblk=0
                next
              }
              { print }
            ' /tmp/x35s-periph.dts > /tmp/x35s-periph.dts.new
            if dtc -I dts -O dtb -o "$X35S_PERIPH" /tmp/x35s-periph.dts.new 2>/dev/null; then
              PERIPH_FDT="/dtbs/$(basename "$X35S_PERIPH")"
              echo "--> Variante USB 'peripheral' criada: $X35S_PERIPH"
              dtc -I dtb -O dts "$X35S_PERIPH" 2>/dev/null | grep -A5 'usb@fcc00000' || true
            else
              echo "!!! Falha ao gerar a variante 'peripheral'; só o DTB padrão (otg) irá."
            fi
          fi
        fi

        # O boot lê este extlinux.conf; se o FDT apontar para um arquivo que não
        # existe, o aparelho acende o LED e fica sem imagem. Falha rápido se o
        # device tree ativo (o da X55, aparelho em teste) não tiver sido gerado.
        if [ ! -f /mnt/boot/dtbs/rk3566-powkiddy-x55.dtb ]; then
          echo "!!! FDT ativo ausente: dtbs/rk3566-powkiddy-x55.dtb." >&2
          echo "!!! Sem o device tree da X55 o aparelho não tem imagem (LED aceso, tela preta)." >&2
          exit 1
        fi
        # X35S/X35H compartilham o mesmo DTB; sem ele a imagem ainda serve a X55,
        # mas a entrada alternativa da X35S/X35H ficaria quebrada — apenas avisa.
        if [ ! -f "/mnt/boot/${X35S_DEFAULT}" ]; then
          echo "!!! AVISO: DTB da X35S/X35H ausente (${X35S_DEFAULT}); só a X55 bootará." >&2
        fi

        echo "--> Gravando walkmam.conf (rotação da interface Kodi; editável no PC)..."
        cat << 'WALKMAMCONF' > /mnt/boot/walkmam.conf
        # Configuração editável do Walkmam. Lida no boot por start-kodi-wayland.sh.
        # display_transform: normal | rotate-90 | rotate-180 | rotate-270 |
        #                    flipped | flipped-rotate-90 | flipped-rotate-180 | flipped-rotate-270
        # X55 (painel 720x1280 montado deitado): rotate-270.
        # X35S/X35H (painel 640x480): normal.
        display_transform=rotate-270
        WALKMAMCONF

        echo "--> Criando extlinux.conf ativo para a Powkiddy X55 (aparelho em teste)..."
        mkdir -p /mnt/boot/extlinux
        cat << "BOOTCFG" > /mnt/boot/extlinux/extlinux.conf
        LABEL Walkmam (Powkiddy X55 - Kodi)
            KERNEL /Image
            FDT /dtbs/rk3566-powkiddy-x55.dtb
            APPEND quiet rootwait earlycon=uart8250,mmio32,0xfe660000 console=ttyS2,1500000n8 console=tty1 root=/dev/mmcblk1p2 rw walkmam_x55_gamepad=rocknix-v1
        BOOTCFG

        # Referência: variante usando o nosso próprio .dtb compilado, caso o
        # oficial da ROCKNIX dê algum problema de incompatibilidade.
        cat << "BOOTCFG3" > /mnt/boot/extlinux/extlinux.conf.x35s-nosso
        LABEL Mainline (X35S - nosso .dtb)
            KERNEL /Image
            FDT /dtbs/rk3566-powkiddy-x35s-nosso.dtb
            APPEND quiet rootwait earlycon=uart8250,mmio32,0xfe660000 console=ttyS2,1500000n8 console=tty1 root=/dev/mmcblk1p2 rw
        BOOTCFG3

        # Mesma imagem serve para X35S/X35H (mesmo DTB): no PC (partição FAT),
        # copie o conteúdo deste arquivo por cima de extlinux.conf e ajuste
        # display_transform=normal em walkmam.conf.
        cat << X35SBOOT > /mnt/boot/extlinux/extlinux.conf.x35s
        LABEL Walkmam (Powkiddy X35S / X35H)
            KERNEL /Image
            FDT /${X35S_DEFAULT}
            APPEND quiet rootwait earlycon=uart8250,mmio32,0xfe660000 console=ttyS2,1500000n8 console=tty1 root=/dev/mmcblk1p2 rw
        X35SBOOT

        if [ -n "$PERIPH_FDT" ]; then
          cat << PERIPHBOOT > /mnt/boot/extlinux/extlinux.conf.x35s-peripheral
        LABEL Walkmam (X35H/X35S - USB peripheral, teste)
            KERNEL /Image
            FDT $PERIPH_FDT
            APPEND quiet rootwait earlycon=uart8250,mmio32,0xfe660000 console=ttyS2,1500000n8 console=tty1 root=/dev/mmcblk1p2 rw
        PERIPHBOOT
          echo "--> Alternativa de boot gravada: extlinux/extlinux.conf.x35s-peripheral"
        fi

        echo "--> Copiando rootfs..."
        cp -a rootfs/* /mnt/rootfs/

        echo "--> Desmontando e limpando..."
        umount /mnt/boot
        umount /mnt/rootfs
        losetup -d ${LOOP_DEV}

        echo "--> Compactando imagem final..."
        gzip -f ${IMAGE_NAME}
        EOF

    - name: Prepare Output Directory
      run: |
        mkdir -p output
        mv rk3566-x55-mainline-sdcard.img.gz output/

    - name: Upload SD Card Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rk3566-x55-mainline-sdcard-image
        path: output/rk3566-x55-mainline-sdcard.img.gz
