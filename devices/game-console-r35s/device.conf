# Game Console R35S (R35S/R36S da Data Frog & clones) — Rockchip RK3326.
#
# ATENÇÃO: esta placa NÃO é RK3566 (família X55/X35S/X35H). O RK3326 é da
# família PX30: outro DTS (rk3326-*), outro U-Boot (mainline: odroid-go2) e
# outros blobs do rkbin (px30_bl31/px30_ddr). O pipeline atual
# (.github/workflows/build.yml) só constrói RK3566, então esta placa fica
# registrada e recusada pelo empacotador (image_dtb vazio) até existir um
# pipeline RK3326. O caminho e os números estão em docs/r35s-rk3326.md.
#
# Contexto do diretório: os dois .dts em dts/ vieram DECOMPILADOS de .dtb de
# kernel de fabricante (BSP) e são a fonte confirmada do painel. Nada aqui foi
# validado em hardware desta placa.
id=game-console-r35s
model=Game Console R35S (RK3326)
status=reference-rk3326-needs-separate-pipeline
# Sem DTB confirmado para boot no nosso kernel: ver "próximos passos" em
# docs/r35s-rk3326.md (base mainline candidata: rk3326-anbernic-rg351m.dtb).
image_dtb=
# U-Boot mainline não tem defconfig para o R35S; o mais próximo é odroid-go2
# (RK3326). Não preencher com um chute: ver docs/r35s-rk3326.md.
uboot_defconfig=
# Painel 640x480 montado na horizontal; rotação não medida nesta placa.
display_transform=normal
