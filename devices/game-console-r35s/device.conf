# Game Console R35S (R35S/R36S da Data Frog & clones) — Rockchip RK3326.
#
# ATENÇÃO: esta placa NÃO é RK3566 (família X55/X35S/X35H). O RK3326 é da
# família PX30: outro DTS (rk3326-*), outro U-Boot (mainline: odroid-go2) e
# outros blobs do rkbin (px30_bl31/px30_ddr). Por isso ela tem a SUA PRÓPRIA
# linha de CI: .github/workflows/build-rk3326.yml (a linha RK3566 continua em
# build.yml e não foi tocada). Contexto: docs/r35s-rk3326.md.
#
# Confirmado nos arquivos do aparelho (2026-10-30, ver §9 do doc): a unidade é
# painel "panel4", o DTB base que funciona é o rk3326-gameconsole-r36s.dtb
# (painel sitronix,st7703 + joypad rocknix-singleadc-joypad) e o painel é
# aplicado por overlay (FDTOVERLAYS /overlays/mipi-panel.dtbo), não por DTB
# próprio.
id=game-console-r35s
model=Game Console R35S (RK3326)
status=ci-rk3326-aguardando-teste-em-hardware
# DTB base oficial da ROCKNIX, copiado para dts/ (sha256 b84245e6...). O CI usa
# WALKMAN_DTB_SOURCE apontando para esse arquivo; não é compilado do kernel.
image_dtb=rk3326-gameconsole-r36s.dtb
# U-Boot mainline (U-Boot 2017.09 de fabricante NÃO é usado: a linha é limpa).
uboot_defconfig=odroid-go2
# Painel 640x480 montado na horizontal; rotação ainda não medida nesta placa.
display_transform=normal
