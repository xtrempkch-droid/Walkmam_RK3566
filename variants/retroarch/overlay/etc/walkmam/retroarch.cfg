# Configuração do RetroArch para a variante "retroarch" (jogos).
#
# Este arquivo é um MODELO: o build substitui @LIBRETRO_DIR@ pelo diretório real
# dos cores (o Debian instala em /usr/lib/<triple>/libretro) e o copia para
# /root/.config/retroarch/retroarch.cfg. O RetroArch completa as chaves que
# faltarem na primeira saída e reescreve o arquivo.
#
# Só estão aqui as chaves que importam para este hardware; o resto é padrão.

# Wayland: o Weston já aplicou a rotação (display_transform), então o RetroArch
# só precisa desenhar em cima.
#
# ATENÇÃO ao nome dos drivers nesta versão. O RetroArch do Debian 12 é o 1.14,
# onde "wayland" NÃO é video_driver: é video_context_driver. Os identificadores
# conferidos no fonte 1.14 são:
#   video_driver:          gl, glcore, vulkan, drm, ...
#   video_context_driver:  wayland, kms, x, ...
# (Em versões mais novas o driver passou a se chamar "kmsdrm" e os contextos
# foram unificados; não copie configuração de tutorial moderno para cá.)
video_driver = "gl"
video_context_driver = "wayland"
video_fullscreen = "true"
video_vsync = "true"
video_scale_integer = "false"

# Áudio: ALSA direto no codec RK817 (mesma placa do Kodi, "rk817_ext").
audio_driver = "alsa"
audio_latency = "64"

# Controles: o joypad ROCKNIX aparece como "retrogame_joypad" (17 botões,
# 4 eixos). O driver udev detecta sozinho.
input_joypad_driver = "udev"

# Caminhos. Conferidos no pacote do Debian 12: os cores NÃO são *.so, vêm como
# <nome>.libretro (ex.: /usr/lib/aarch64-linux-gnu/libretro/mgba.libretro), e os
# metadados em /usr/share/libretro/info. O RetroArch aceita as duas extensões.
libretro_directory = "@LIBRETRO_DIR@"
libretro_info_path = "/usr/share/libretro/info/"
assets_directory = "/usr/share/libretro/assets/"

# ROMs: /boot/roms fica na partição FAT, que é o ÚNICO lugar que se lê de um PC
# sem rede — é o caminho prático para copiar jogo (e o único possível na X35H,
# onde o USB não ancora). Limite de ~90 MB; para biblioteca grande, Wi-Fi + scp
# para /storage/roms (ext4, 4 GB).
rgui_browser_directory = "/boot/roms"
savefile_directory = "/storage/saves"
savestate_directory = "/storage/states"
screenshot_directory = "/storage/screenshots"
system_directory = "/storage/bios"

# Menu "ozone" é o que o Debian usa por padrão e o que tem os assets instalados.
menu_driver = "ozone"

# Grava a config ao sair, para o usuário conseguir mudar opções pelo menu e
# manter as mudanças entre boots.
config_save_on_exit = "true"

# Sair pelo menu pede confirmação (dois toques) — e sair DESLIGA o aparelho:
# o RetroArch 1.14 não tem item "Desligar", então o launcher
# (start-retroarch.sh) faz `systemctl poweroff` depois que o processo termina
# normalmente. Dois toques evitam desligar sem querer. Para apenas sair do app
# (depurar por SSH/serial), use retroarch_exit=stay em /boot/walkmam.conf.
quit_press_twice = "true"
