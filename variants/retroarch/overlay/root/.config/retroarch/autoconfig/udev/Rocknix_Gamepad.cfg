# Perfil do controle embutido dos handhelds ROCKNIX (rk3566): "retrogame_joypad".
#
# Por que este arquivo existe: o pacote Debian do RetroArch 1.14 NÃO traz nenhum
# perfil de autoconfig (dpkg -L retroarch | grep autoconfig = vazio), e sem perfil
# o log diz:
#   [Autoconf]: retrogame_joypad (18507/4353) not configured.
# Resultado: nenhum botão ou analógico responde no RetroArch.
#
# Os números NÃO são códigos evdev: são a POSIÇÃO do botão na enumeração do
# driver udev do RetroArch (input/drivers_joypad/udev_joypad.c), que varre os
# keycodes utilizáveis em ordem crescente. Para este controle o bitmap
# (/sys/class/input/event3/device/capabilities/key = "f00000000 0 0 0
# 7fdb000000000000 0 0 0 0") dá exatamente 17 botões:
#
#   0 BTN_A(bottom)   1 BTN_B(right)   2 BTN_X(top)     3 BTN_Y(left)
#   4 BTN_TL          5 BTN_TR         6 BTN_TL2         7 BTN_TR2
#   8 BTN_SELECT      9 BTN_START     10 BTN_MODE       11 BTN_THUMBL
#  12 BTN_THUMBR     13 BTN_DPAD_UP   14 BTN_DPAD_DOWN  15 BTN_DPAD_LEFT
#  16 BTN_DPAD_RIGHT
#
# No DTS da X55 os rótulos aparecem trocados ("GPIO BTN-A" emite BTN_B,
# "GPIO BTN-B" emite BTN_A): o A físico fica à DIREITA e o B EMBAIXO, que é a
# convenção do RetroPad (A = direita, B = baixo). Se o DTS mudar, este arquivo
# muda junto.
input_driver = "udev"
input_device = "retrogame_joypad"
input_vendor_id = "18507"
input_product_id = "4353"

input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
input_menu_toggle_btn = "10"
input_l3_btn = "11"
input_r3_btn = "12"
input_up_btn = "13"
input_down_btn = "14"
input_left_btn = "15"
input_right_btn = "16"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"
