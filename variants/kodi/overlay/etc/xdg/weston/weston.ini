# Fallback estático. O start-kodi-wayland.sh gera o weston.ini real em
# $XDG_RUNTIME_DIR a cada boot, com o transform lido de /boot/walkmam.conf.
# Valores válidos de transform: normal, rotate-90, rotate-180, rotate-270,
# flipped, flipped-rotate-90, flipped-rotate-180, flipped-rotate-270.
[core]
shell=kiosk-shell.so
idle-time=0

[output]
name=DSI-1
transform=normal
